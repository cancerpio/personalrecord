name: CI / Deploy to GitHub Pages

on:
  # 只有 main 會走到部署。其他分支若要驗證，開 PR 即可。
  push:
    branches: [main]
  # PR 上跑 build + test，作為 review 前的 gate；不部署。
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 每個 ref 各自一組，避免 PR 的 run 取消掉正在進行的 main 部署。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_STORAGE_MODE: ${{ vars.VITE_STORAGE_MODE }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # 只從 main 的 push 部署。少了這個條件，推 feature branch 就會把
    # 未經 review 的程式碼發布到正式站（2026-08 實際發生過數次）。
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
